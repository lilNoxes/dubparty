<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DubParty - Редактор Сцен</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a2e; color: #fff; padding-top: 20px; }
        .editor-container { display: flex; height: 90vh; gap: 20px; }
        .video-panel { flex: 1; min-width: 400px; display: flex; flex-direction: column; }
        .lines-panel { flex: 2; overflow-y: auto; background: #16213e; padding: 20px; border-radius: 8px; }
        .line-card { background: #0f3460; padding: 15px; margin-bottom: 15px; border-radius: 8px; border-left: 5px solid #e94560; }
        .line-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9em; color: #a2a2bd; }
        .btn-play { background: #e94560; color: white; border: none; padding: 2px 10px; border-radius: 4px; cursor: pointer; }
        .form-control { background: #1a1a2e; color: white; border: 1px solid #e94560; }
        .form-control:focus { background: #1a1a2e; color: white; box-shadow: none; border-color: #ff6b81; }
        .top-bar { display: flex; justify-content: space-between; margin-bottom: 20px; }
    </style>
</head>
<body class="container-fluid">
    <div class="top-bar">
        <h2>Редактор Сцен (Только для GM)</h2>
        <div class="d-flex gap-2">
            <select id="scene-select" class="form-select" style="width: 300px;"></select>
            <button id="btn-save" class="btn btn-success">Сохранить изменения</button>
        </div>
    </div>

    <div class="editor-container">
        <!-- Video & Characters -->
        <div class="video-panel">
            <video id="video-player" controls style="width: 100%; border-radius: 8px; background: #000;"></video>
            
            <h4 class="mt-4">Роли в сцене (Characters)</h4>
            <div id="characters-container" class="mt-2"></div>
            <button id="btn-add-char" class="btn btn-sm btn-outline-light mt-2">+ Добавить роль</button>
            <div class="mt-3">
                <small class="text-muted">Эти роли будут предложены игрокам для выбора. Убедитесь, что имена здесь совпадают с именами, указанными в репликах.</small>
            </div>
        </div>

        <!-- Lines Editor -->
        <div class="lines-panel" id="lines-container">
            <div class="text-center text-muted mt-5">Выберите сцену для редактирования...</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
